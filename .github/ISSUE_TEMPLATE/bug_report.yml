name: Bug report
description: Report a problem with a minimal synthetic reproduction.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use invented data only. Do not attach production HARs, private endpoints, cookies, tokens, or customer payloads.
        For a possible data exposure or unsafe rendering issue, follow SECURITY.md instead of posting details here.
  - type: input
    id: version
    attributes:
      label: Tracebrief version
      description: The version shown by the app or CLI --version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and operating system, or Node.js version for the CLI.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and synthetic example
      description: Smallest steps that reproduce the issue. Replace every real value with invented data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: This report contains no production capture, private endpoint, credential, or customer data.
          required: true
